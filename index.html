function readingTimeKey(b){return [b.title,b.author,b.volumes,b.pageCount].map(v=>String(v||'').trim().toLowerCase()).join('|')}
function readingTimeMatches(p){const index=new Map();model.books.filter(b=>Core.statusOf(b)==='Read').forEach(b=>{const k=readingTimeKey(b),rows=index.get(k)||[];rows.push(b);index.set(k,rows)});const used=new Set();return (p?.books||[]).map(Core.normalizeBook).filter(b=>Core.statusOf(b)==='Read'&&b.detailedStart&&b.detailedFinish).map(b=>({source:b,matches:index.get(readingTimeKey(b))||[]})).filter(x=>x.matches.length===1&&!used.has(x.matches[0].id)&&used.add(x.matches[0].id))}
function applyReadingTimeImport(){const matches=readingTimeMatches(ui.importPreview);matches.forEach(({source,matches})=>{matches[0].detailedStart=source.detailedStart;matches[0].detailedFinish=source.detailedFinish});ui.importPreview=null;persist();render();toast(`Updated reading times for ${matches.length} books`)}
function importSummary(p){let newCount=0,updateCount=0,ambiguousCount=0;for(const book of p.books||[]){try{if(Core.importBookMatch(model.books,book))updateCount++;else newCount++}catch{ambiguousCount++}}return {newCount,updateCount,ambiguousCount}}
function importModal(p){const {newCount,updateCount,ambiguousCount}=importSummary(p),intent=ui.importIntent||(p.backup?'restore':'merge'),books=(p.books||[]).map(Core.normalizeBook),conflicts=(p.books||[]).filter(book=>{try{Core.importBookMatch(model.books,book);return false}catch{return true}});return `<div class="overlay" onclick="if(event.target===this)cancelImport()"><section class="modal"><div class="modal-head"><h2 class="modal-title">${p.backup?'Restore or merge your backup':'Import your library'}</h2><button class="close" onclick="cancelImport()">×</button></div><div class="modal-body"><p><strong>${esc(p.name||'Library file')}</strong> · ${books.length} ${books.length===1?'book':'books'} found</p><div class="import-intents"><label class="import-intent"><input type="radio" name="import-intent" value="merge" ${intent==='merge'?'checked':''} onchange="NookUI.setImportIntent('merge')"><span><strong>Merge book records</strong><small>Add new books and update supplied fields on matching books. ${!p.backup&&p.sourceTables?'Workbook dropdown choices, quotes and planning tables are also imported.':'Keep current settings, budgets and history.'}</small></span></label><label class="import-intent"><input type="radio" name="import-intent" value="${p.backup?'restore':'replace'}" ${intent!=='merge'?'checked':''} onchange="NookUI.setImportIntent('${p.backup?'restore':'replace'}')"><span><strong>${p.backup?'Restore full backup':'Replace book library'}</strong><small>${p.backup?'Replace all library data and settings with this backup.':'Replace the current books and workbook planning data with this file.'} A recovery copy is saved first.</small></span></label></div>${intent==='merge'?`<div class="preview-summary"><div class="preview-stat"><b>${newCount}</b> new records</div><div class="preview-stat"><b>${updateCount}</b> matching records</div></div><p class="panel-note">Matches use a saved ID, or title, author and volume. Fields omitted from the import are preserved.${!p.backup&&p.sourceTables?` This workbook also contains ${Object.keys(p.sourceTables).length} tables and ${(p.quotes||[]).length} quotes. Workbook planning values are included in this merge.`:''}</p>${ambiguousCount?`<details class="import-conflicts" open><summary>${ambiguousCount} ambiguous ${ambiguousCount===1?'record':'records'} — Merge is disabled</summary><p>More than one saved book matches. Include the saved book ID in the file to choose the correct record; no changes have been made.</p><ul>${conflicts.map(book=>`<li>${esc(book.title||book['THE BOOKS']||'Untitled')} · ${esc(book.volumes||book['MY VOLUMES']||'No volume')}</li>`).join('')}</ul></details>`:''}`:`<section class="backup-scope"><strong>This file will replace:</strong><dl><dt>Books</dt><dd>${books.length}</dd><dt>Wishlist entries</dt><dd>${p.shopping?.length||p.sourceTables?.Shopping?.rows?.length||0}</dd><dt>Quotes</dt><dd>${p.quotes?.length||0}</dd><dt>Recommendation history</dt><dd>${p.recommendationHistory?.length||0}</dd><dt>Picker history</dt><dd>${p.draftPickerHistory?.length||0}</dd><dt>Budgets & settings</dt><dd>${p.backup?'All saved values':'Workbook values'}</dd></dl><p class="panel-note">You will confirm this replacement on the next step. Your current library will be available under Settings → Recover previous library.</p></section>`}${readingTimeMatches(p).length?`<details><summary>Only importing missing reading times?</summary><p>Update recorded start and finish timestamps without changing book details or settings.</p><button class="secondary" onclick="applyReadingTimeImport()">Update reading times only · ${readingTimeMatches(p).length}</button></details>`:''}</div><div class="modal-foot"><button class="secondary" onclick="cancelImport()">Cancel</button><button class="primary import-action" data-import-action ${intent==='merge'&&ambiguousCount?'disabled':''} onclick="NookUI.requestImportAction()">${intent==='merge'?'Merge records':p.backup?'Review restoration':'Review replacement'}</button></div></section></div>`}
function showImport(data){if(!Array.isArray(data?.books)){toast('No book records were found in that file. Choose a library JSON, CSV or workbook.','error');return}ui.importIntent=data.backup?'restore':'merge';ui.importPreview={...data};ui.selected=null;ui.editing=null;ui.settingsOpen=false;render()}
function cancelImport(){ui.importPreview=null;render()}
function applyImport(replace){const p=ui.importPreview;if(!p)return;const incoming=p.books.map(Core.normalizeBook);if(replace&&p.backup){const {name,backup,...state}=p;const restored=Core.migrateState(state);for(const key of Object.keys(model))delete model[key];Object.assign(model,restored);model.dropdownOptions=model.dropdownOptions||JSON.parse(JSON.stringify(WORKBOOK_DROPDOWN_DEFAULTS));model.annualBudgets=model.annualBudgets||{};model.monthlyBudgetsByYear=model.monthlyBudgetsByYear||{};model.readingCheckIns=model.readingCheckIns||[];model.sidebarOrder=model.sidebarOrder||{};ui.mode=model.mode||'NEUTRAL';ui.importPreview=null;persist();render();toast('Full backup restored');return}let merged;try{merged=replace?incoming:Core.mergeBooks(model.books,p.books)}catch(error){toast(error.message,'error');return}model.books=merged;if(!replace&&p.backup){ui.importPreview=null;persist();render();toast(`${incoming.length} book records merged; current settings and history kept`);return}if(replace){model.recommendationSnapshots=[];model.recommendationEvents=[];model.readingAttempts=[];model.engineEvaluations=[];model.shopping=[];model.discounts=[];model.recommendationHistory=[];model.draftPickerHistory=[];model.draftPickerRounds={};model.quotes=[];model.sourceTables={}}if(p.quotes?.length)model.quotes=p.quotes.map(q=>typeof q==='string'?q:q.text||q.quote||'').filter(Boolean);if(p.scoringThresholds)model.scoringThresholds={...p.scoringThresholds};if(p.sourceTables)model.sourceTables={...model.sourceTables,...p.sourceTables};if(p.dropdownOptions)for(const [key,values] of Object.entries(p.dropdownOptions)){const existing=model.dropdownOptions[key]||[];model.dropdownOptions[key]=[...new Set([...existing,...values.map(String)])]}const dealRows=p.sourceTables?.Discount_Table18?.rows||[];if(dealRows.length){const mapped=dealRows.map(d=>({title:d.BOOKS||'',volume:d.VOLUME||'',cost:d.COST||'',discount:d.DISCOUNT||'',adjustedPrice:d['ADJUSTED PRICE']||''})).filter(d=>d.title);if(replace)model.discounts=mapped;else{const existingDeals=new Set(model.discounts.map(d=>d.title.toLowerCase()));model.discounts.push(...mapped.filter(d=>!existingDeals.has(d.title.toLowerCase())))}}const wish=p.sourceTables?.Shopping?.rows||p.sourceTables?.Table15?.rows||[];if(wish.length){const mapped=wish.filter(w=>w['SHOPPING WISHLIST']&&w.STATUS!=='Status').map(w=>({title:w['SHOPPING WISHLIST'],author:w.AUTHOR||'',volumes:w.VOLUMES||w.VOLUME||'',quantity:Core.numeric(w.BOOKS)||1,priority:Math.max(1,Math.min(5,Core.numeric(w.PRIORITY)||5)),status:w.STATUS||'Wishlist',cost:w['EST. PRICE']||'',notes:w.NOTES||''})).filter(w=>w.title);if(replace)model.shopping=mapped;else{const existing=new Set(model.shopping.map(w=>String(w.title||'').toLowerCase()));model.shopping.push(...mapped.filter(w=>!existing.has(w.title.toLowerCase())))}}const budgetRows=p.sourceTables?.Monthly_Budget?.rows||[];const current=budgetRows.find(r=>String(r.MONTH||'').toLowerCase()===new Date().toLocaleString('en-GB',{month:'long'}).toLowerCase());if(current?.BUDGET)model.budget=Core.numeric(current.BUDGET);const totalBudget=budgetRows.find(r=>String(r.MONTH||'').toLowerCase()==='total');if(totalBudget?.BUDGET){const year=String(new Date().getFullYear());model.annualBudgets=model.annualBudgets||{};model.annualBudgets[year]=Core.numeric(totalBudget.BUDGET)}ui.importPreview=null;persist();render();toast(`${incoming.length} book records imported`)}
function chooseImport(){if(window.NookUI?.isBusy()){toast('Please wait for the current import to finish.','loading');return}if(window.NookUI?.guardDiscard(chooseImport))return;ui.settingsOpen=false;window.webkit?.messageHandlers?.chooseImport?.postMessage('');if(!window.webkit?.messageHandlers?.chooseImport)$('#import-file').click()}
$('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const ext=file.name.split('.').pop().toLowerCase();if(ext==='json'){const data=JSON.parse(await file.text());showImport({name:file.name,...(Array.isArray(data)?{books:data}:data),backup:!Array.isArray(data)&&data.schemaVersion!=null})}else if(ext==='csv'){showImport({name:file.name,books:Core.parseCSV(await file.text())})}else if(ext==='xlsx'||ext==='xlsm'){window.setImportBusy?.(true);if(!window.importNovelTrackerWorkbook)throw new Error('Choose the workbook using the Mac File menu, or use a JSON/CSV library.');showImport(await window.importNovelTrackerWorkbook(file));window.setImportBusy?.(false)}else toast('Choose a JSON backup, CSV file or Excel workbook.','error')}catch(err){window.setImportBusy?.(false);toast(`Could not read file: ${err.message}`,'error')}e.target.value=''});
window.receiveWorkbookImport=data=>{window.setImportBusy?.(false);showImport(data)};
window.receiveCoverImage=(ext,base64,name)=>{try{const extension=String(ext||'').toLowerCase();if(!/^(png|jpe?g|gif|webp|heic|tiff?)$/.test(extension)){toast('Choose a supported image file for the book cover.','error');return}const mime=({jpg:'jpeg',jpe:'jpeg',tif:'tiff'})[extension]||extension,bytes=Uint8Array.from(atob(base64),character=>character.charCodeAt(0)),file=new File([bytes],name||('cover.'+extension),{type:'image/'+mime});prepareCoverFile(file)}catch(error){toast(`Could not read cover image: ${error.message}`,'error')}};
window.receiveFileImport=(ext,base64,name)=>{try{if(window._choosingCoverImage){window._choosingCoverImage=false;window.receiveCoverImage(ext,base64,name);return}const raw=decodeURIComponent(Array.from(atob(base64)).map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join(''));if(ext==='json'){const data=JSON.parse(raw);showImport({name,...(Array.isArray(data)?{books:data}:data),backup:!Array.isArray(data)&&data.schemaVersion!=null})}else if(ext==='csv')showImport({name,books:Core.parseCSV(raw)});else toast('Choose a JSON backup, CSV file or Excel workbook.','error')}catch(err){toast(`Could not read file: ${err.message}`,'error')}};
function downloadFallback(name,mime,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportPayload(format,content){const h=window.webkit?.messageHandlers?.exportData;if(h)h.postMessage({format,content});else downloadFallback(format==='json'?'NovelTracker-Backup.json':'NovelTracker-Books.csv',format==='json'?'application/json':'text/csv',content)}
function exportJSON(){exportPayload('json',JSON.stringify(model,null,2))}
function exportCSV(){const rows=model.books;const keys=[...new Set(rows.flatMap(b=>Object.keys(b)))];const quote=x=>`"${String(x??'').replaceAll('"','""')}"`;const text=[keys.map(quote).join(','),...rows.map(b=>keys.map(k=>quote(b[k])).join(','))].join('\r\n');exportPayload('csv',text)}
function showError(msg){window.setImportBusy?.(false);toast(msg||'The file could not be opened','error')}
window.showError=showError;window.manageDropdownLists=()=>{if(window.NookUI?.guardDiscard(window.manageDropdownLists))return;ui.editing=null;ui.selected=null;ui.settingsOpen=false;ui.listManager=true;render()};
window.addEventListener('keydown',e=>{const target=e.target,typing=target instanceof Element&&!!target.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"]),[role="textbox"]');if(e.key==='Backspace'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();if(ui.editing===null&&!ui.importPreview&&!ui.listManager&&!ui.startPromptId&&!ui.finishPromptId&&!ui.selected)goBackPage()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();editBook(null)}if(e.key==='Escape'){if(ui.importPreview)cancelImport();else if(ui.editing!==null)cancelEdit();else if(ui.selected)closeDetail()}});
window.NookUI?.init();
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
